<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forge Tracker</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist@5/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist-mono@5/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css">

<style>
/* =========================================================
   FORGE DESIGN TOKENS — colors, type, layout, components
   ========================================================= */
:root {
  --primary-50:#EDF2F0; --primary-100:#D4E0DC; --primary-200:#A8C2BB;
  --primary-300:#7DA59B;--primary-400:#51877A; --primary-500:#2A4D45;
  --primary-600:#1F3A33;--primary-700:#152721; --primary-800:#0A1410;
  --secondary-50:#F2F4F4;--secondary-100:#E2E6E6;--secondary-200:#CAD0D0;
  --secondary-300:#A2ABAB;--secondary-400:#7E8888;--secondary-500:#5A6464;
  --secondary-600:#3F4646;--secondary-700:#262C2C;--secondary-800:#16191A;
  --secondary-900:#0A0B0B;
  --tertiary-50:#F8FBE5;--tertiary-100:#EFF5C2;--tertiary-200:#E2EC8E;
  --tertiary-300:#D5E370;--tertiary-400:#C5DC55;--tertiary-500:#A8BE3C;
  --tertiary-600:#88992E;--tertiary-700:#6A7521;

  --surface-bg:#FFFFFF;--surface-card:#FFFFFF;--surface-muted:var(--secondary-50);
  --surface-sunken:var(--secondary-50);
  --text-primary:var(--secondary-800);--text-secondary:var(--secondary-500);
  --text-tertiary:var(--secondary-400);
  --accent-primary:var(--primary-500);--accent-tertiary:var(--tertiary-400);
  --accent-warm:var(--tertiary-700);--accent-warm-soft:var(--tertiary-50);
  --accent-soft:var(--primary-50);
  --border:var(--secondary-100);--border-strong:var(--secondary-300);
  --on-primary:#FFFFFF;

  --font-sans:'Geist Variable','Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --font-mono:'Geist Mono Variable','Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --w-r:400;--w-m:500;--w-s:600;
  --tracking-tag:0.14em;

  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;
  --space-6:24px;--space-8:32px;--space-12:48px;

  --r-sm:4px;--r-md:8px;--r-lg:12px;--r-pill:999px;
  --hair:0.5px;
}
:root[data-theme="dark"] {
  --surface-bg:var(--secondary-900);
  --surface-card:var(--secondary-800);
  --surface-muted:var(--secondary-700);
  --surface-sunken:#0F1213;
  --text-primary:var(--secondary-50);
  --text-secondary:var(--secondary-300);
  --text-tertiary:var(--secondary-400);
  --accent-primary:var(--tertiary-400);
  --accent-warm:var(--tertiary-400);
  --accent-warm-soft:rgba(197,220,85,0.10);
  --accent-soft:rgba(197,220,85,0.10);
  --border:var(--secondary-700);
  --border-strong:var(--secondary-500);
  --on-primary:var(--primary-700);
}

/* ---------- reset + base ---------- */
*,*::before,*::after { box-sizing: border-box; }
html, body { margin:0; padding:0; }
body {
  font-family: var(--font-sans);
  background: var(--surface-bg);
  color: var(--text-primary);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; color: inherit; }
.tabular { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); }
.tag {
  font-family: var(--font-mono); font-weight: var(--w-m);
  font-size: 11px; letter-spacing: var(--tracking-tag);
  text-transform: uppercase; color: var(--text-secondary);
}
.dim { color: var(--text-tertiary); }

/* =========================================================
   HEADER
   ========================================================= */
.hd {
  position: sticky; top: 0; z-index: 10;
  display: grid; grid-template-columns: 1fr auto 1fr;
  align-items: center;
  height: 64px; padding: 0 32px;
  background: var(--surface-card);
  border-bottom: var(--hair) solid var(--border);
}
.hd-l { display: flex; align-items: center; gap: 14px; }
.hd-mark {
  width: 28px; height: 28px;
  display: grid; place-items: center;
}
.hd-mark svg { width: 28px; height: 28px; }
:root[data-theme="dark"] .hd-mark svg path { fill: var(--tertiary-400); }
.hd-id { display: flex; flex-direction: column; line-height: 1.1; }
.hd-eyebrow {
  font-family: var(--font-mono); font-size: 10px; font-weight: var(--w-m);
  letter-spacing: var(--tracking-tag); text-transform: uppercase;
  color: var(--text-secondary);
}
.hd-title {
  font-family: var(--font-sans); font-weight: var(--w-s); font-size: 15px;
  color: var(--text-primary); margin-top: 2px;
  letter-spacing: -0.005em;
}
.hd-c { display: flex; align-items: center; gap: 18px; }
.hd-c .pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: var(--tracking-tag);
  text-transform: uppercase; color: var(--text-secondary);
  padding: 5px 10px; border-radius: var(--r-pill);
  background: var(--surface-muted);
}
.hd-c .pill .ph { font-size: 13px; color: var(--text-tertiary); }
.hd-c .pill b { font-weight: var(--w-m); color: var(--text-primary); }
.hd-c .live::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%;
  background: var(--tertiary-500);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--tertiary-400) 30%, transparent);
}
.hd-r { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
.icon-btn {
  width: 36px; height: 36px; border-radius: var(--r-md);
  background: transparent; border: var(--hair) solid var(--border);
  display: grid; place-items: center; cursor: pointer;
  transition: background 120ms ease, border-color 120ms ease;
  color: var(--text-primary);
}
.icon-btn:hover { background: var(--surface-muted); border-color: var(--border-strong); }
.icon-btn .ph { font-size: 18px; }

/* =========================================================
   PAGE LAYOUT
   ========================================================= */
.page { max-width: 1280px; margin: 0 auto; padding: 28px 32px 64px; }

/* Section — title-only, no leading number.
   Hairline rests under the whole row (no inline <hr>, no center artifact). */
.sec {
  display: grid; grid-template-columns: 1fr auto;
  align-items: baseline; gap: 16px;
  margin: 36px 0 16px;
  padding-bottom: 10px;
  border-bottom: var(--hair) solid var(--border);
}
.sec .title {
  font-family: var(--font-sans); font-weight: var(--w-s); font-size: 19px;
  color: var(--text-primary); letter-spacing: -0.005em;
}
.sec .end {
  font-family: var(--font-mono); font-size: 10px; font-weight: var(--w-m);
  letter-spacing: var(--tracking-tag); text-transform: uppercase;
  color: var(--text-tertiary);
}

/* =========================================================
   HERO — project name + status line + meta
   ========================================================= */
.hero { padding: 8px 0 16px; }
.hero h1 {
  font-size: 30px; line-height: 1.15; letter-spacing: -0.02em;
  font-weight: var(--w-s); margin: 0 0 8px; color: var(--text-primary);
}
.hero-status {
  font-family: var(--font-mono); font-size: 14px;
  color: var(--text-primary); letter-spacing: -0.005em;
  font-variant-numeric: tabular-nums;
}
.hero-status b { color: var(--text-primary); font-weight: var(--w-m); }
.hero-meta {
  margin-top: 4px;
  font-size: 12px; color: var(--text-tertiary);
  font-family: var(--font-mono);
}
.hero-meta b { color: var(--text-secondary); font-weight: var(--w-m); }

/* =========================================================
   AT-A-GLANCE KPI STRIP + OVERALL PROGRESS
   ========================================================= */
.kpis {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-top: 8px;
}
@media (max-width: 720px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
.kpi {
  border: var(--hair) solid var(--border);
  border-radius: var(--r-md);
  padding: 14px 16px;
  background: var(--surface-card);
}
.kpi-lbl {
  font-family: var(--font-mono); font-size: 10px; font-weight: var(--w-m);
  letter-spacing: var(--tracking-tag); text-transform: uppercase;
  color: var(--text-tertiary); margin-bottom: 6px;
}
.kpi-val {
  font-family: var(--font-mono); font-size: 26px; font-weight: var(--w-m);
  color: var(--text-primary); font-variant-numeric: tabular-nums;
  line-height: 1.15;
}
.kpi-sub {
  font-size: 11px; color: var(--text-tertiary); margin-top: 4px;
  line-height: 1.4;
}
.kpi.shipped .kpi-val { color: var(--tertiary-700); }
:root[data-theme="dark"] .kpi.shipped .kpi-val { color: var(--tertiary-400); }
.kpi.in-flight .kpi-val::after {
  content: "";
  display: inline-block;
  width: 7px; height: 7px;
  margin-left: 8px; margin-bottom: 4px;
  border-radius: 50%;
  background: var(--tertiary-400);
  vertical-align: middle;
}

.overall {
  margin-top: 16px;
  padding: 14px 0 4px;
  border-top: var(--hair) solid var(--border);
}
.overall-head {
  display: flex; justify-content: space-between; align-items: baseline;
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.10em; color: var(--text-secondary);
  margin-bottom: 8px; text-transform: uppercase;
}
.overall-pct { color: var(--text-primary); font-size: 13px; font-variant-numeric: tabular-nums; }
.overall-bar {
  height: 6px; background: var(--secondary-100); border-radius: var(--r-pill);
  overflow: hidden;
}
:root[data-theme="dark"] .overall-bar { background: var(--secondary-700); }
.overall-fill { height: 100%; background: var(--tertiary-400); border-radius: var(--r-pill); }
.overall-breakdown {
  margin-top: 8px;
  display: flex; gap: 10px; flex-wrap: wrap;
  font-family: var(--font-mono); font-size: 11px;
  color: var(--text-secondary); font-variant-numeric: tabular-nums;
}
.overall-breakdown b { color: var(--text-primary); font-weight: var(--w-m); }

/* =========================================================
   SETUP — dot row + labels + foundation disclosure
   ========================================================= */
.setup-dots {
  display: flex; align-items: center; gap: 16px;
  padding: 4px 0 8px;
}
.setup-dot {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary);
  white-space: nowrap;
}
.dot {
  width: 12px; height: 12px; border-radius: 50%;
  background: transparent;
  border: var(--hair) solid var(--secondary-300);
  flex-shrink: 0;
}
.dot.half {
  background: linear-gradient(to right, var(--tertiary-400) 50%, transparent 50%);
  border-color: var(--tertiary-600);
}
.dot.full {
  background: var(--tertiary-400);
  border-color: var(--tertiary-600);
}
.setup-dot b { color: var(--text-primary); font-weight: var(--w-m); }
.setup-line { flex: 1; height: 1px; background: var(--border); min-width: 8px; }

.setup-labels {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 12px; font-size: 12px; color: var(--text-tertiary);
  margin-top: 6px; padding-bottom: 4px;
}
.setup-labels .lab { font-family: var(--font-mono); }
.setup-labels .lab b { color: var(--text-secondary); font-weight: var(--w-m); }
.setup-labels .lab .when { color: var(--text-tertiary); font-size: 11px; margin-left: 6px; }

.setup-disclosure {
  margin-top: 10px;
  font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary);
}
.setup-disclosure summary { cursor: pointer; list-style: none; padding: 4px 0; }
.setup-disclosure summary::-webkit-details-marker { display: none; }
.setup-disclosure summary::before { content: "▸ "; color: var(--text-tertiary); }
.setup-disclosure[open] summary::before { content: "▾ "; color: var(--text-secondary); }
.setup-disclosure summary:hover { color: var(--text-primary); }

.slices-table {
  width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12.5px;
}
.slices-table th, .slices-table td {
  text-align: left; padding: 6px 8px;
  border-bottom: var(--hair) dashed var(--border);
}
.slices-table th {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: var(--tracking-tag);
  text-transform: uppercase; color: var(--text-secondary); font-weight: var(--w-m);
}
.slices-table td.id { font-family: var(--font-mono); color: var(--text-secondary); }
.slices-table td.status { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); }

.setup-empty {
  font-size: 13px; color: var(--text-tertiary);
  padding: 18px 0; font-family: var(--font-mono);
}
.setup-empty code { font-size: 12.5px; color: var(--accent-primary); }

/* Sealed setup — one-line summary, dots stay visible */
.setup-sealed-line {
  font-family: var(--font-mono); font-size: 12.5px;
  color: var(--text-secondary); padding: 4px 0;
}
.setup-sealed-line b { color: var(--tertiary-700); font-weight: var(--w-m); }
:root[data-theme="dark"] .setup-sealed-line b { color: var(--tertiary-400); }

/* =========================================================
   DELIVERY — phased (tabs) and flat
   ========================================================= */
.del-tabs {
  display: grid;
  grid-template-columns: repeat(var(--col-count, 4), minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}
@media (max-width: 900px) { .del-tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 540px) { .del-tabs { grid-template-columns: 1fr; } }
.del-tab {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 6px 12px;
  align-items: center;
  padding: 14px 16px;
  background: var(--surface-card);
  border: var(--hair) solid var(--border);
  border-radius: var(--r-md);
  cursor: pointer;
  color: var(--text-primary); font: inherit; text-align: left;
  transition: border-color 100ms, background 100ms, box-shadow 100ms;
  min-height: 92px;
}
.del-tab:hover { box-shadow: 0 1px 3px rgba(10,11,11,0.05); }
.del-tab:hover { border-color: var(--border-strong); }
.del-tab.active {
  border-color: var(--accent-primary);
  background: var(--accent-soft);
}
:root[data-theme="dark"] .del-tab.active {
  border-color: var(--tertiary-400);
  background: rgba(197,220,85,0.10);
}
.del-tab-num {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em;
  color: var(--text-tertiary); text-transform: uppercase;
  grid-row: 1; grid-column: 1;
}
.del-tab-status {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.10em;
  text-transform: uppercase; color: var(--text-tertiary);
  grid-row: 1; grid-column: 2; text-align: right;
}
.del-tab-status.in-progress { color: var(--tertiary-700); }
:root[data-theme="dark"] .del-tab-status.in-progress { color: var(--tertiary-400); }
.del-tab-status.complete { color: var(--text-secondary); }
.del-tab-title {
  grid-row: 2; grid-column: 1 / -1;
  font-size: 13px; font-weight: var(--w-s); color: var(--text-primary);
  display: flex; align-items: center; gap: 6px;
}
.del-tab-meta {
  grid-row: 3; grid-column: 1 / -1;
  display: flex; gap: 8px; align-items: center;
  font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary);
  font-variant-numeric: tabular-nums;
}

.del-bar {
  width: 110px; height: 6px; border-radius: var(--r-pill);
  background: var(--secondary-100); overflow: hidden;
  display: inline-block; vertical-align: middle;
}
:root[data-theme="dark"] .del-bar { background: var(--secondary-700); }
.del-bar-fill { height: 100%; background: var(--tertiary-400); }

.del-panel { display: none; }
.del-panel.active { display: block; }
.del-panel-head {
  padding: 4px 0 10px;
  border-bottom: var(--hair) dashed var(--border);
  margin-bottom: 10px;
  color: var(--text-secondary); font-size: 12.5px;
  font-family: var(--font-mono);
}
.del-panel-head b { color: var(--text-primary); font-weight: var(--w-m); }
.del-panel-head .theme { color: var(--text-secondary); }

.del-feat {
  display: grid;
  grid-template-columns: 1.4fr 0.7fr 0.6fr 0.9fr 80px 70px 18px;
  align-items: center;
  gap: 12px;
  padding: 8px 0;
  font-size: 12.5px;
  border-bottom: var(--hair) dashed var(--border);
}
.del-feat.no-who {
  grid-template-columns: 1.4fr 0.7fr 0.9fr 80px 70px 18px;
}
/* +1 track for the optional feature due-date column, only when present */
.del-feat.has-due { grid-template-columns: 1.4fr 0.7fr 0.6fr 0.9fr 80px 70px 70px 18px; }
.del-feat.no-who.has-due { grid-template-columns: 1.4fr 0.7fr 0.9fr 80px 70px 70px 18px; }
.del-feat.no-who .who { display: none; }

/* Blocked-by column — Patina chip per dep id. Empty when no blockers; the
   empty cell IS the signal (a single chip in an otherwise-empty column
   stands out at a glance across a phase's feature rows). Patina (not
   Verdigris) deliberately — Verdigris is the dashboard's progress accent,
   Patina here means "attention / depends on something". */
.del-feat .blocked-cell {
  display: flex; gap: 4px; flex-wrap: wrap; align-items: center;
  font-family: var(--font-mono); font-size: 11px; min-width: 0;
}
.del-feat .blocked-chip {
  display: inline-flex; align-items: center;
  padding: 2px 8px; border-radius: var(--r-pill);
  background: var(--primary-50); color: var(--primary-500);
  border: var(--hair) solid var(--primary-300);
  font-weight: var(--w-m); white-space: nowrap;
  letter-spacing: 0.01em;
}
:root[data-theme="dark"] .del-feat .blocked-chip {
  background: rgba(125,165,155,0.15);
  color: var(--primary-300);
  border-color: var(--primary-400);
}
.del-feat:last-child { border-bottom: none; }
.del-feat .name { font-family: var(--font-mono); font-size: 13.5px; color: var(--text-primary); font-weight: var(--w-m); }
.del-feat .name .warn {
  display: inline-block; color: var(--accent-warm); margin-left: 4px;
  cursor: help;
}
/* Open-bug badge + rework lineage line on a feature row (FR-7). Both live
   inside the name cell so the rigid del-feat grid stays untouched. */
.del-feat .name .bug-badge {
  display: inline-flex; align-items: center; gap: 3px; margin-left: 6px;
  padding: 1px 6px; border-radius: var(--r-pill);
  background: var(--accent-warm-soft); color: var(--accent-warm);
  border: var(--hair) solid var(--tertiary-300);
  font-family: var(--font-mono); font-size: 10px; font-weight: var(--w-m);
  vertical-align: middle; cursor: help;
}
.del-feat .name .rework-line {
  display: block; margin-top: 3px;
  font-family: var(--font-mono); font-size: 10.5px; font-weight: var(--w-r);
  color: var(--text-tertiary); letter-spacing: 0.01em;
}
.del-feat .name .rework-line.reworks { color: var(--primary-500); }
.del-feat .phase {
  font-family: var(--font-mono); font-size: 10px;
  text-transform: uppercase; letter-spacing: 0.08em;
  padding: 2px 8px; border-radius: var(--r-pill);
  background: var(--surface-muted); color: var(--text-secondary);
  border: var(--hair) solid var(--border); justify-self: start;
}
.del-feat .phase.dev    { color: var(--primary-500); border-color: var(--primary-300); background: var(--primary-50); }
.del-feat .phase.review { color: var(--tertiary-700); border-color: var(--tertiary-300); background: var(--tertiary-50); }
.del-feat .phase.done   { color: var(--secondary-500); }
.del-feat .phase.paused { color: var(--accent-warm); background: var(--accent-warm-soft); border-color: var(--tertiary-300); }
:root[data-theme="dark"] .del-feat .phase.dev    { background: rgba(125,165,155,0.15); color: var(--primary-300); border-color: var(--primary-400); }
:root[data-theme="dark"] .del-feat .phase.review { background: rgba(197,220,85,0.12); color: var(--tertiary-400); border-color: rgba(197,220,85,0.35); }
.del-feat .who { color: var(--text-secondary); font-size: 12px; }
.del-feat .due { color: var(--text-tertiary); font-family: var(--font-mono); font-size: 11px; white-space: nowrap; }
.del-feat .ago { color: var(--text-tertiary); font-family: var(--font-mono); font-size: 11px; }
.del-feat .caret { color: var(--text-tertiary); text-align: right; }

.del-gd { display: inline-flex; gap: 3px; vertical-align: middle; }
.del-gd span {
  width: 8px; height: 8px; border-radius: 50%;
  background: transparent;
  border: var(--hair) solid var(--secondary-300);
}
.del-gd span.on { background: var(--tertiary-400); border-color: var(--tertiary-600); }

.del-flat-group {
  margin-top: 14px;
}
.del-flat-group h3 {
  font-family: var(--font-mono); font-size: 11px; font-weight: var(--w-m);
  letter-spacing: var(--tracking-tag); text-transform: uppercase;
  color: var(--text-secondary); margin: 0 0 6px;
}

.del-empty {
  padding: 20px 0; color: var(--text-tertiary); font-size: 13px;
  font-family: var(--font-mono);
}
.del-empty code { color: var(--accent-primary); font-size: 12.5px; }

/* =========================================================
   SIGNALS — 7 tiles
   ========================================================= */
.signals-callout {
  border-left: 3px solid var(--accent-primary);
  background: var(--surface-muted);
  padding: 12px 16px;
  margin: 10px 0 14px;
  border-radius: 0 var(--r-md) var(--r-md) 0;
  font-size: 12.5px; color: var(--text-secondary); line-height: 1.55;
}
.signals-callout p { margin: 0 0 6px; }
.signals-callout p:last-child { margin-bottom: 0; }
.signals-callout strong { color: var(--text-primary); }

.signals {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 14px 18px;
  margin-top: 4px;
}
@media (max-width: 1180px) { .signals { grid-template-columns: repeat(4, 1fr); } }
@media (max-width: 1024px) { .signals { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 600px)  { .signals { grid-template-columns: repeat(2, 1fr); } }
.sig-lbl {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 4px;
}
.sig-val {
  font-family: var(--font-mono); font-variant-numeric: tabular-nums;
  font-size: 19px; color: var(--text-primary); font-weight: var(--w-m);
  line-height: 1.25;
}
.sig-val.placeholder { color: var(--text-tertiary); font-size: 13px; font-weight: var(--w-r); }
.sig-sub { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; line-height: 1.4; }
.metrics-group { margin-top: 20px; }
.metrics-group:first-of-type { margin-top: 10px; }
.metrics-group-title {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--text-secondary); font-weight: var(--w-m);
  margin: 0 0 10px; padding-bottom: 5px; border-bottom: var(--hair) solid var(--border);
}
.metrics-group .signals { grid-template-columns: repeat(4, max-content); gap: 14px 48px; }
@media (max-width: 600px) { .metrics-group .signals { grid-template-columns: repeat(2, 1fr); gap: 14px 18px; } }
.metrics-baseline { margin-top: 20px; font-size: 12px; color: var(--text-tertiary); line-height: 1.5; }
.metrics-baseline strong { color: var(--text-secondary); }

.spark { display: inline-flex; gap: 2px; vertical-align: middle; margin-left: 6px; height: 14px; align-items: flex-end; }
.spark i { display: block; width: 4px; background: var(--tertiary-400); border-radius: 1px; min-height: 1px; }

/* Signals drill-downs (Bugs by scheduled-fix phase; Rework lineage). Collapsed
   by default — the tiles carry the headline, these carry the detail. */
.sig-drill {
  margin-top: 16px; border-top: var(--hair) solid var(--border); padding-top: 12px;
}
.sig-drill + .sig-drill { margin-top: 10px; border-top: none; padding-top: 0; }
.sig-drill summary {
  cursor: pointer; font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.04em; color: var(--text-secondary); user-select: none;
}
.sig-drill summary:hover { color: var(--text-primary); }
.sig-drill[open] summary { margin-bottom: 8px; color: var(--text-primary); }
.bug-group { margin: 8px 0 10px; }
.bug-group-hd {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 4px;
}
.bug-group-hd em { color: var(--accent-primary); font-style: normal; }
.bug-row {
  display: flex; gap: 10px; align-items: baseline; padding: 3px 0;
  font-size: 12px; color: var(--text-secondary);
  border-bottom: var(--hair) dashed var(--border);
}
.bug-row:last-child { border-bottom: none; }
.bug-id { font-family: var(--font-mono); color: var(--text-primary); font-weight: var(--w-m); white-space: nowrap; }
.bug-title { flex: 1; min-width: 0; color: var(--text-primary); }
.bug-affects { font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary); white-space: nowrap; }
.bug-sev {
  font-family: var(--font-mono); font-size: 10px; text-transform: uppercase;
  padding: 1px 6px; border-radius: var(--r-pill); white-space: nowrap;
  border: var(--hair) solid var(--border); color: var(--text-tertiary);
}
.bug-sev.sev-high   { color: var(--accent-warm); background: var(--accent-warm-soft); border-color: var(--tertiary-300); }
.bug-sev.sev-medium { color: var(--tertiary-700); background: var(--tertiary-50); border-color: var(--tertiary-300); }

/* =========================================================
   RELEASE / UAT — conditional (hidden unless TRACKER.release non-empty)
   ========================================================= */
.rel-head {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 4px 0 12px;
  font-family: var(--font-mono); font-size: 13px; color: var(--text-primary);
}
.rel-head .rel-id { font-weight: var(--w-s); font-size: 15px; }
.rel-head .rel-scope { color: var(--text-tertiary); font-size: 12px; }
.rel-status {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.10em;
  text-transform: uppercase; padding: 3px 10px; border-radius: var(--r-pill);
  background: var(--surface-muted); color: var(--text-secondary);
  border: var(--hair) solid var(--border);
}
.rel-status.uat,
.rel-status.regression { color: var(--tertiary-700); background: var(--tertiary-50); border-color: var(--tertiary-300); }
.rel-status.stabilize  { color: var(--accent-warm); background: var(--accent-warm-soft); border-color: var(--tertiary-300); }
.rel-status.signed-off { color: var(--primary-500); background: var(--primary-50); border-color: var(--primary-300); }
.rel-status.live { color: var(--on-primary); background: var(--accent-primary); border-color: var(--accent-primary); }
:root[data-theme="dark"] .rel-status.uat,
:root[data-theme="dark"] .rel-status.regression { color: var(--tertiary-400); background: rgba(197,220,85,0.12); border-color: rgba(197,220,85,0.35); }
:root[data-theme="dark"] .rel-status.signed-off { color: var(--primary-300); background: rgba(125,165,155,0.15); border-color: var(--primary-400); }
:root[data-theme="dark"] .rel-status.live { color: var(--primary-700); background: var(--tertiary-400); border-color: var(--tertiary-400); }

/* Lifecycle track — six steps (build-complete → … → live), the active one filled */
.rel-track {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  padding: 2px 0 14px;
  font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary);
}
.rel-step {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 2px 8px; border-radius: var(--r-pill);
  border: var(--hair) solid var(--border); background: var(--surface-card);
  letter-spacing: 0.04em;
}
.rel-step.done { color: var(--text-secondary); border-color: var(--border-strong); }
.rel-step.current {
  color: var(--on-primary); background: var(--accent-primary);
  border-color: var(--accent-primary); font-weight: var(--w-m);
}
:root[data-theme="dark"] .rel-step.current { color: var(--primary-700); }
.rel-step-sep { color: var(--text-tertiary); }

/* Cycle rows */
.rel-cycles { margin-top: 6px; }
.rel-cycle {
  display: grid;
  grid-template-columns: 70px 1fr auto auto;
  gap: 12px; align-items: center;
  padding: 8px 0; font-size: 12.5px;
  border-bottom: var(--hair) dashed var(--border);
}
.rel-cycle:last-child { border-bottom: none; }
.rel-cycle .cyc-id { font-family: var(--font-mono); color: var(--text-primary); font-weight: var(--w-m); }
.rel-cycle .cyc-id .rnd { color: var(--text-tertiary); font-weight: var(--w-r); }
.rel-cycle .cyc-type { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); }
.rel-cycle .cyc-flows { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rel-cycle .cyc-flows b { color: var(--tertiary-700); font-weight: var(--w-m); }
:root[data-theme="dark"] .rel-cycle .cyc-flows b { color: var(--tertiary-400); }
.cyc-status {
  font-family: var(--font-mono); font-size: 10px; text-transform: uppercase;
  letter-spacing: 0.06em; padding: 1px 8px; border-radius: var(--r-pill);
  border: var(--hair) solid var(--border); color: var(--text-tertiary); white-space: nowrap;
}
.cyc-status.passed,
.cyc-status.passed-with-risks { color: var(--tertiary-700); background: var(--tertiary-50); border-color: var(--tertiary-300); }
.cyc-status.failed { color: var(--accent-warm); background: var(--accent-warm-soft); border-color: var(--tertiary-300); }
.cyc-status.running { color: var(--primary-500); background: var(--primary-50); border-color: var(--primary-300); }

/* Blocking issues + triage breakdown */
.rel-blocking {
  margin-top: 12px; padding: 10px 14px;
  border-left: 3px solid var(--accent-warm);
  background: var(--accent-warm-soft); border-radius: 0 var(--r-md) var(--r-md) 0;
  font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary);
}
.rel-blocking b { color: var(--accent-warm); }
.rel-triage {
  display: flex; gap: 18px; flex-wrap: wrap;
  margin-top: 14px; padding-top: 12px;
  border-top: var(--hair) solid var(--border);
  font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary);
  font-variant-numeric: tabular-nums;
}
.rel-triage .tri { display: inline-flex; align-items: baseline; gap: 6px; }
.rel-triage .tri b { color: var(--text-primary); font-weight: var(--w-m); font-size: 14px; }
.rel-triage .tri .lbl { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-tertiary); }
.rel-empty { padding: 16px 0; color: var(--text-tertiary); font-size: 12.5px; font-family: var(--font-mono); }

/* =========================================================
   USAGE — conditional one-liner
   ========================================================= */
.usage-line {
  display: flex; align-items: center; gap: 12px;
  font-family: var(--font-mono); font-size: 13px; color: var(--text-primary);
  padding: 4px 0;
  font-variant-numeric: tabular-nums;
}
.usage-line b { color: var(--text-primary); font-weight: var(--w-m); }
.usage-line .arrow {
  margin-left: auto; color: var(--accent-primary);
  font-family: var(--font-sans); font-size: 13px; text-decoration: none;
  border-bottom: var(--hair) solid transparent; transition: border-color 100ms;
}
.usage-line .arrow:hover { border-bottom-color: var(--accent-primary); }

/* =========================================================
   ACTIVITY rail
   ========================================================= */
.activity { padding: 2px 0; }
.activity .row {
  display: grid; grid-template-columns: 80px 1fr auto;
  gap: 14px; align-items: baseline;
  padding: 6px 0;
  border-bottom: var(--hair) dashed var(--border);
  font-size: 12.5px;
}
.activity .row:last-child { border-bottom: none; }
.activity .when { font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary); }
.activity .what { color: var(--text-primary); }
.activity .what b { color: var(--text-primary); font-weight: var(--w-m); }
.activity .what .kind {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--text-tertiary); margin-right: 6px;
}
.activity .ref { font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary); }
.activity-empty {
  padding: 16px 0; color: var(--text-tertiary); font-size: 12.5px;
  font-family: var(--font-mono);
}

/* =========================================================
   MISSING TRACKER fallback
   ========================================================= */
.missing { padding: 64px 32px; text-align: center; color: var(--text-secondary); }
.missing h2 { font-size: 18px; margin: 0 0 12px; color: var(--text-primary); font-weight: var(--w-s); }
.missing pre {
  display: inline-block; text-align: left;
  background: var(--surface-muted); padding: 12px 16px; border-radius: var(--r-md);
  font-family: var(--font-mono); font-size: 12px; color: var(--text-primary);
  border: var(--hair) solid var(--border); margin-top: 8px;
}
.missing .hint { font-size: 12.5px; color: var(--text-tertiary); margin-top: 14px; }

/* =========================================================
   UTILITY
   ========================================================= */
.hidden { display: none !important; }
</style>
</head>
<body>

<header class="hd">
  <div class="hd-l">
    <div class="hd-mark" aria-hidden="true">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 4 C 30 14, 22 18, 22 28 C 22 34, 26 36, 26 42 C 26 38, 30 36, 30 32 C 30 38, 36 38, 36 32 C 36 38, 38 42, 38 46 C 38 40, 42 38, 42 32 C 42 26, 36 24, 36 16 C 36 26, 32 22, 32 4 Z M 32 60 C 22 60, 14 52, 14 42 C 14 50, 22 56, 32 56 C 42 56, 50 50, 50 42 C 50 52, 42 60, 32 60 Z" fill="#2A4D45"/>
      </svg>
    </div>
    <div class="hd-id">
      <span class="hd-eyebrow">Forge · Tracker</span>
      <span class="hd-title" id="hd-project">—</span>
    </div>
  </div>
  <div class="hd-c">
    <span class="pill"><i class="ph ph-file-text"></i><span>tracker.yaml</span></span>
    <span class="pill"><span>Harness</span><b id="hd-version">—</b></span>
    <span class="pill live"><span>Updated</span><b id="hd-updated">—</b></span>
  </div>
  <div class="hd-r">
    <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme">
      <i class="ph ph-moon" id="theme-icon"></i>
    </button>
  </div>
</header>

<main class="page" id="page">

  <!-- HERO -->
  <section class="hero">
    <h1 id="hero-project">—</h1>
    <div class="hero-status" id="hero-status">—</div>
    <div class="hero-meta" id="hero-meta" hidden></div>
  </section>

  <!-- KPI strip + overall progress -->
  <section class="kpis" id="kpis" aria-label="At a glance"></section>
  <section class="overall" id="overall" aria-label="Overall progress"></section>

  <!-- SETUP -->
  <div class="sec">
    <span class="title">Setup</span>
<span class="end" id="setup-end">—</span>
  </div>
  <section id="setup-body" aria-label="Setup"></section>

  <!-- DELIVERY -->
  <div class="sec">
    <span class="title">Delivery</span>
<span class="end" id="delivery-end">—</span>
  </div>
  <section id="delivery-body" aria-label="Delivery"></section>

  <!-- RELEASE / UAT — conditional. Hidden unless TRACKER.release is non-empty.
       Post-delivery lifecycle: regression → uat → stabilize → sign-off. -->
  <div class="sec hidden" id="release-sec">
    <span class="title">Release / UAT</span>
<span class="end" id="release-end">—</span>
  </div>
  <section id="release-body" class="hidden" aria-label="Release and UAT"></section>

  <!-- WAVE DRUMBEAT — conditional. Hidden unless ≥1 feature has waves[]. -->
  <div class="sec hidden" id="wave-drumbeat-sec">
    <span class="title">Wave Drumbeat</span>
<span class="end" id="wave-drumbeat-end">—</span>
  </div>
  <section id="wave-drumbeat-body" class="hidden" aria-label="Wave drumbeat"></section>

  <!-- SIGNALS -->
  <div class="sec">
    <span class="title">Signals</span>
<span class="end" id="signals-end">v1 · 7 indicators</span>
  </div>
  <section id="signals-body" aria-label="Signals"></section>

  <!-- DELIVERY METRICS — conditional. Hidden unless window.METRICS is non-empty.
       Estimation baseline derived from .forge/metrics/*.jsonl. -->
  <div class="sec hidden" id="metrics-sec">
    <span class="title">Delivery Metrics</span>
    <span class="end" id="metrics-end">—</span>
  </div>
  <section id="metrics-body" class="hidden" aria-label="Delivery metrics"></section>

  <!-- USAGE — conditional. Hidden unless window.USAGE has rows for this project. -->
  <div class="sec hidden" id="usage-sec">
    <span class="title">Usage</span>
<span class="end" id="usage-end">—</span>
  </div>
  <section id="usage-body" class="hidden" aria-label="Usage"></section>

  <!-- ACTIVITY -->
  <div class="sec">
    <span class="title">Recent activity</span>
<span class="end" id="activity-end">last 5</span>
  </div>
